name: Publicar GestorPro no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          test -f docs/index.html
          touch docs/.nojekyll
      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
