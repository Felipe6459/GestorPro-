name: CI Integration & E2E

# Skeleton only (Stage 2) — no local Supabase/Docker startup wired up yet.
# See Stage 1's design doc for the full plan; each TODO below names the
# stage that fills it in.

on:
  pull_request:

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO: once ci-fast and this workflow need to gate each other, either
    # move both into one workflow file with a real `needs:` between jobs,
    # or trigger this one via `workflow_run` on ci-fast's success.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TODO (Stage 3/4): start the local Supabase stack
