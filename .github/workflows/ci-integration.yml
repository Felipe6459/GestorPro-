name: CI Integration & E2E

# Stage 4 update: the Prisma integration suite (test/integration/**) now
# runs for real, against an in-process PGlite Postgres (see test/support/
# local-postgres.ts) — no Docker/Supabase CLI needed, since this sandbox
# had neither Docker nor a writable Homebrew available (see the Stage 4
# report for the full story). Playwright E2E is still a TODO for Stage 5,
# since it needs a running app server, which this stage deliberately does
# not stand up (test/integration never touches a browser or HTTP server).

on:
  pull_request:

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO: once ci-fast and this workflow need to gate each other, either
    # move both into one workflow file with a real `needs:` between jobs,
    # or trigger this one via `workflow_run` on ci-fast's success.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Starts its own PGlite instance, creates the anon/authenticated
      # role stand-ins, and runs a real `prisma migrate deploy` — all
      # inside Vitest's globalSetup (test/integration/global-setup.ts).
      # No separate "start the database" step needed.
      - name: Integration tests (Vitest + real Prisma, PGlite-backed)
        run: npm run test:integration

      # TODO (Stage 5): build + start the app, then run Playwright E2E
      # against a local `next start` — never the Vercel Preview URL (see
      # Stage 1's design). Needs its own Supabase Auth strategy (this
      # stage's auth-mock harness only works for direct Vitest calls, not
      # a real browser session).
      #   - run: npm run build
      #   - run: npm run start &
      #   - run: npm run test:e2e

      # TODO (Stage 5+): real Supabase PostgREST/Auth verification against
      # an actual Supabase project (local `supabase start` under Docker, or
      # a dedicated cloud test project) — see test/integration/security/
      # grants.test.ts's own documented TODO for exactly what's missing.

      - name: Upload Playwright/Vitest artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
