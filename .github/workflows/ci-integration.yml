      # TODO (Stage 3/4): build + start the app against the local stack's
      # env vars — a local `next start`, never the Vercel Preview URL (see
      # Stage 1's design)
      #   - run: npm run build
      #   - run: npm run start &

      # TODO (Stage 4): integration tests (Vitest + Prisma + HTTP)
