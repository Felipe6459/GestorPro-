name: Construir APK GestorPro

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construir APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Publicar APK no GitHub Pages
        run: |
          mkdir -p docs/download
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/download/GestorPro.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/download/GestorPro.apk
          if git diff --cached --quiet; then
            echo 'APK sem alterações.'
          else
            git commit -m 'Atualiza APK do GestorPro'
            git push
          fi
