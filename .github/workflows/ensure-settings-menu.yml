name: Ensure GestorPro settings and vendor menu
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add panel modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/painel.html')
          text = p.read_text(encoding='utf-8')

          marker = '<button data-v="whatsapp">WhatsApp</button>'
          button = marker + '<button id="gpConfigTab" data-v="settings" type="button">⚙ Configurações</button>'
          if 'id="gpConfigTab"' not in text and marker in text:
              text = text.replace(marker, button, 1)

          modules = [
              '<script type="module" src="./configuracoes-whatsapp.js?v=20260905"></script>',
              '<script type="module" src="./vendedores.js?v=20260905"></script>',
              '<script type="module" src="./owner-enhancements.js?v=20260905"></script>',
              '<script src="./owner-ui-fix.js?v=20260905"></script>',
              '<script type="module" src="./credit-finance-fix.js?v=20260905"></script>',
          ]
          for module in modules:
              filename = module.split('src="./',1)[1].split('?',1)[0]
              if filename not in text:
                  text = text.replace('</body>', module + '</body>', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- docs/painel.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/painel.html
          git commit -m "feat: add owner client details, credit controls and dashboard colors"
          git push
