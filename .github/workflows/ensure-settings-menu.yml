name: Ensure GestorPro settings menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add settings module to panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/painel.html')
          text = p.read_text(encoding='utf-8')

          marker = '<button data-v="whatsapp">WhatsApp</button>'
          button = marker + '<button id="gpConfigTab" data-v="settings" type="button">⚙ Configurações</button>'
          if 'id="gpConfigTab"' not in text and marker in text:
              text = text.replace(marker, button, 1)

          module = '<script type="module" src="./configuracoes-whatsapp.js?v=20260903"></script>'
          if 'configuracoes-whatsapp.js' not in text:
              text = text.replace('</body>', module + '</body>', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- docs/painel.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/painel.html
          git commit -m "fix: add WhatsApp settings button to GestorPro panel"
          git push