<!doctype html><html lang="pt-BR"><head><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.svg"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site Cineplay — GestorPro</title><style>body{margin:0;background:#0b0912;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:26px;font-weight:700;color:#a78bfa}.muted{color:#aaa}.panel{background:#171326;border:1px solid #30264d;border-radius:14px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#aaa}input,textarea{box-sizing:border-box;width:100%;background:#0f0c18;color:#fff;border:1px solid #40365c;border-radius:8px;padding:10px}textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;background:#8b5cf6;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#29233b}.save{background:#7b2cff}.msg{min-height:22px;margin-top:10px}.ok{color:#86efac}.err{color:#fca5a5}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">🌐 Site Cineplay</div><div class="muted">Gerenciamento do site pelo Master do GestorPro</div></div><div class="row"><button class="secondary" id="back">← Voltar ao GestorPro</button><button id="open">Abrir site</button></div></div><div id="msg" class="msg"></div><section class="panel"><h3>💰 Planos e preços</h3><div class="grid"><div class="field"><label>Mensal — 1 tela</label><input id="monthly_1" type="number" step="0.01"></div><div class="field"><label>Mensal — 2 telas</label><input id="monthly_2" type="number" step="0.01"></div><div class="field"><label>Mensal — 3 telas</label><input id="monthly_3" type="number" step="0.01"></div><div class="field"><label>Anual — 1 tela</label><input id="annual_1" type="number" step="0.01"></div><div class="field"><label>Anual — 2 telas</label><input id="annual_2" type="number" step="0.01"></div><div class="field"><label>Anual — 3 telas</label><input id="annual_3" type="number" step="0.01"></div></div></section><section class="panel"><h3>📲 Contatos e pagamento</h3><div class="grid"><div class="field"><label>WhatsApp (somente números)</label><input id="whatsapp"></div><div class="field"><label>Instagram</label><input id="instagram"></div><div class="field"><label>Chave Pix</label><input id="pix_key"></div></div></section><section class="panel"><h3>🎥 Vídeo e conteúdo principal</h3><div class="grid"><div class="field wide"><label>URL do vídeo do YouTube</label><input id="youtube"></div><div class="field"><label>Título principal</label><input id="hero_title"></div><div class="field wide"><label>Texto principal</label><textarea id="hero_text"></textarea></div><div class="field"><label>Texto do teste</label><input id="trial_text"></div><div class="field"><label>Quantidade de conteúdos</label><input id="content_count"></div><div class="field"><label>Qualidade</label><input id="quality_text"></div><div class="field wide"><label>Compatibilidade</label><input id="compatibility"></div></div></section><section class="panel"><h3>❓ Perguntas frequentes</h3><div class="grid"><div class="field"><label>Pergunta 1</label><input id="faq_1_q"></div><div class="field wide"><label>Resposta 1</label><textarea id="faq_1_a"></textarea></div><div class="field"><label>Pergunta 2</label><input id="faq_2_q"></div><div class="field wide"><label>Resposta 2</label><textarea id="faq_2_a"></textarea></div><div class="field"><label>Pergunta 3</label><input id="faq_3_q"></div><div class="field wide"><label>Resposta 3</label><textarea id="faq_3_a"></textarea></div></div></section><div class="row"><button class="save" id="save">💾 Salvar alterações</button><button class="secondary" id="reload">↻ Recarregar</button></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://jbdjfmvdrwdfnuhqrprc.supabase.co','sb_publishable_3ABEFAwN_wzmSu13EyVOwQ_h5Xfmz80',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const ids=['monthly_1','monthly_2','monthly_3','annual_1','annual_2','annual_3','whatsapp','instagram','pix_key','youtube','hero_title','hero_text','trial_text','content_count','quality_text','compatibility','faq_1_q','faq_1_a','faq_2_q','faq_2_a','faq_3_q','faq_3_a'];const $=id=>document.getElementById(id);function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}function fill(c){ids.forEach(id=>{$(id).value=c?.[id]??''})}async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./index.html';return false}const{data:p,error}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(error||p?.role!=='master'){document.body.innerHTML='<div class="wrap"><div class="panel"><h2>Acesso restrito</h2><p>Esta área está disponível somente para o usuário Master.</p><button onclick="location.href=\'./painel.html\'">Voltar</button></div></div>';return false}return true}async function load(){msg('Carregando...',true);const r=await sb.from('cineplay_site_settings').select('content,updated_at').eq('id',1).maybeSingle();if(r.error){msg('Erro ao carregar: '+r.error.message);return}fill(r.data?.content||{});msg(r.data?.updated_at?'Última atualização: '+new Date(r.data.updated_at).toLocaleString('pt-BR'):'Configuração carregada.',true)}$('save').onclick=async()=>{const content={};ids.forEach(id=>content[id]=$(id).value);content.site_name='Cine Player Pro';const{data:{session}}=await sb.auth.getSession();const r=await sb.from('cineplay_site_settings').upsert({id:1,content,updated_at:new Date().toISOString(),updated_by:session.user.id});if(r.error){msg('Não foi possível salvar: '+r.error.message);return}msg('Alterações salvas com sucesso.',true)};$('reload').onclick=load;$('open').onclick=()=>window.open('https://www.cineplayftv.shop/','_blank');$('back').onclick=()=>location.href='./painel.html';(async()=>{if(await guard())await load()})();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
