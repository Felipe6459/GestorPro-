<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GestorPro — Recuperar senha</title><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><style>body{margin:0;background:#0b0912;color:#fff;font-family:system-ui,sans-serif}.box{max-width:430px;margin:10vh auto;padding:28px;background:#171326;border:1px solid #34295a;border-radius:18px}h1{color:#a78bfa}input,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box;border-radius:10px;font:inherit}input{background:#0d0b15;color:#fff;border:1px solid #443765}button{border:0;background:#8b5cf6;color:white;font-weight:700;cursor:pointer}.msg{min-height:24px;margin-top:12px}.ok{color:#34d399}.err{color:#fb7185}.link{display:block;margin-top:16px;text-align:center;color:#c4b5fd}</style></head><body><main class="box"><h1>GestorPro</h1><h2>Recuperar senha</h2><p>Digite o e-mail da sua conta. O link será enviado para esse endereço.</p><form id="form"><input id="email" type="email" placeholder="Seu e-mail" autocomplete="email" required><button id="btn">Enviar link de recuperação</button></form><div id="msg" class="msg"></div><a class="link" href="./">Voltar para o login</a></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://jbdjfmvdrwdfnuhqrprc.supabase.co','sb_publishable_3ABEFAwN_wzmSu13EyVOwQ_h5Xfmz80');const RECOVERY_REDIRECT='https://felipe6459.github.io/GestorPro-/docs/';const form=document.getElementById('form'),email=document.getElementById('email'),btn=document.getElementById('btn'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Enviando...';msg.className='msg';try{const{error}=await s.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:RECOVERY_REDIRECT});if(error)throw error;msg.className='msg ok';msg.textContent='Se a conta existir, enviamos o link para o e-mail informado. Verifique também o spam.'}catch(e){msg.className='msg err';msg.textContent='Não foi possível enviar a recuperação: '+(e?.message||e)}finally{btn.disabled=false;btn.textContent='Enviar link de recuperação'}});</script></body></html>
