<!doctype html>
<html lang="pt-BR">
<head><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.svg"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GestorPro</title>
</head>
<body style="margin:0;background:#0b0912;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="text-align:center">
    <div style="font-size:28px;font-weight:700;color:#a78bfa">GestorPro</div>
    <div style="margin-top:10px;color:#aaa">Abrindo o GestorPro...</div>
  </div>
  <script>
    // GitHub Pages publica este projeto em /GestorPro-/.
    // O redirecionamento anterior removia o nome do repositório e levava para
    // a raiz de github.io, causando o erro 404.
    const target = new URL('/GestorPro-/', window.location.origin);
    target.search = 'v=' + Date.now();
    window.location.replace(target.href);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/GestorPro-/">
  </noscript>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body>
</html>
