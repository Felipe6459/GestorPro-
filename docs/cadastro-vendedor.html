<!doctype html><html lang="pt-BR"><head><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.svg"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8b5cf6"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Cadastro de vendedor • GestorPro</title><style>body{margin:0;background:#0b0912;color:#fff;font-family:system-ui,sans-serif}.box{max-width:460px;margin:7vh auto;padding:28px;background:#171326;border:1px solid #34295a;border-radius:18px}h1{color:#a78bfa}input,button{width:100%;padding:13px;margin-top:10px;box-sizing:border-box;border-radius:10px;font:inherit}input{background:#0d0b15;color:#fff;border:1px solid #443765}button{border:0;background:#8b5cf6;color:#fff;font-weight:700;cursor:pointer}.msg{min-height:24px;margin-top:12px;color:#fb7185;white-space:pre-wrap}.ok{color:#34d399}.link{display:block;margin-top:16px;text-align:center;color:#c4b5fd;text-decoration:none}.muted{color:#aaa;font-size:13px}</style></head><body><div class="box"><h1>GestorPro</h1><h2>Criar conta de vendedor</h2><p class="muted">Faça seu próprio cadastro. Depois de entrar, seu teste gratuito de 7 dias ficará disponível. Após a aprovação/continuidade, o pagamento da mensalidade estará disponível no painel.</p><form id="f"><input id="name" placeholder="Nome completo" required><input id="email" type="email" placeholder="E-mail" required><input id="cpf" inputmode="numeric" maxlength="18" placeholder="CPF ou CNPJ *" required><input id="pass" type="password" minlength="8" placeholder="Senha (mínimo 8 caracteres)" required><input id="code" placeholder="Código de cadastro fornecido pelo proprietário" required><button id="b">Criar minha conta</button></form><div id="msg" class="msg"></div><a class="link" href="./">Voltar para o login</a></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://jbdjfmvdrwdfnuhqrprc.supabase.co','sb_publishable_3ABEFAwN_wzmSu13EyVOwQ_h5Xfmz80',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),cpf=$('cpf');cpf.addEventListener('input',()=>{let v=cpf.value.replace(/\D/g,'').slice(0,14);if(v.length<=11)v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');else v=v.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');cpf.value=v});$('f').onsubmit=async e=>{e.preventDefault();const b=$('b'),m=$('msg'),email=$('email').value.trim().toLowerCase(),password=$('pass').value,doc=cpf.value.replace(/\D/g,'');b.disabled=true;b.textContent='Criando conta...';m.className='msg';m.textContent='';try{if(doc.length!==11&&doc.length!==14)throw Error('Informe um CPF (11 dígitos) ou CNPJ (14 dígitos).');const r=await s.functions.invoke('vendor-signup',{body:{full_name:$('name').value.trim(),email,password,cpf_cnpj:doc,signup_code:$('code').value.trim()}});if(r.error){let detail='';try{if(r.error.context){const x=await r.error.context.json();detail=x?.error||x?.message||''}}catch{}throw Error(detail||r.error.message||'Não foi possível concluir o cadastro.')}if(r.data?.error)throw Error(r.data.error);m.className='msg ok';m.textContent='Cadastro realizado! Abrindo o painel...';const login=await s.auth.signInWithPassword({email,password});if(login.error)throw Error('Cadastro criado, mas não foi possível entrar automaticamente: '+login.error.message);await new Promise(r=>setTimeout(r,300));window.location.replace('https://felipe6459.github.io/GestorPro-/painel.html?v='+Date.now())}catch(e){m.className='msg';m.textContent='Não foi possível criar a conta.\n\n'+(e?.message||'Erro desconhecido.')+'\n\nConfira o CPF/CNPJ, e-mail e código de cadastro e tente novamente.'}finally{b.disabled=false;b.textContent='Criar minha conta'}};</script></body></html>
