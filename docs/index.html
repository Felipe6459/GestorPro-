textContent='Digite a senha.';return}b.disabled=true;b.textContent='Verificando...';m.className='msg';m.textContent='';try{const r=await s.auth.signInWithPassword({email,password});if(r.error){console.error(r.error);m.textContent='Falha no login: '+r.error.message;return}m.className='msg ok';m.textContent='Login confirmado. Abrindo o painel...';setTimeout(()=>location.href='./painel.html?v='+Date.now(),300)}catch(x){console.error(x);m.textContent='Erro de conexão com o Supabase: '+(x?.message||x)}finally{b.disabled=false;b.textContent='Entrar'}});</script></body></html>
