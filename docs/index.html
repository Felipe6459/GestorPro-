<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>GestorPro</title><style>body{margin:0;background:#0b0912;color:#fff;font-family:system-ui,sans-serif}.box{max-width:430px;margin:10vh auto;padding:28px;background:#171326;border:1px solid #34295a;border-radius:18px}h1{color:#a78bfa}input,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box;border-radius:10px;font:inherit}input{background:#0d0b15;color:#fff;border:1px solid #443765}button{border:0;background:#8b5cf6;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:24px;margin-top:12px;color:#fb7185}.ok{color:#34d399}.version{font-size:11px;color:#777;margin-top:18px}.hidden{display:none}.link{display:block;margin-top:16px;text-align:center;color:#c4b5fd;cursor:pointer}</style></head><body><div class="box"><h1>GestorPro</h1><section id="loginView"><h2>Acesso ao painel</h2><p>Entre com sua conta do Supabase.</p><form id="loginForm" autocomplete="off"><input id="email" type="email" value="felipemedeiros6459@gmail.com" autocomplete="username" required><input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required><button id="loginBtn" type="submit">Entrar</button></form><span id="forgot" class="link">Esqueci minha senha</span></section><section id="resetView" class="hidden"><h2>Redefinir senha</h2><p>Digite sua nova senha para a conta do GestorPro.</p><form id="resetForm" autocomplete="off"><input id="newPassword" type="password" placeholder="Nova senha" autocomplete="new-password" minlength="8" required><input id="confirmPassword" type="password" placeholder="Confirme a nova senha" autocomplete="new-password" minlength="8" required><button id="resetBtn" type="submit">Salvar nova senha</button></form></section><div id="msg" class="msg" role="alert"></div><div class="version">GestorPro • Login/Recuperação 2026.09.02</div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://jbdjfmvdrwdfnuhqrprc.supabase.co','sb_publishable_3ABEFAwN_wzmSu13EyVOwQ_h5Xfmz80',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),loginView=$("loginView"),resetView=$("resetView"),msg=$("msg"),loginBtn=$("loginBtn"),resetBtn=$("resetBtn");function showReset(){loginView.classList.add('hidden');resetView.classList.remove('hidden');msg.className='msg ok';msg.textContent='Link de recuperação válido. Crie sua nova senha.'}function showLogin(){resetView.classList.add('hidden');loginView.classList.remove('hidden')}async function handleRecovery(){try{const{data}=await s.auth.getSession();if(data.session)showReset()}catch(e){console.error(e)}}s.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset()});await handleRecovery();$("loginForm").addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='';const email=$("email").value.trim(),password=$("password").value;if(!password){msg.textContent='Digite a senha.';return}loginBtn.disabled=true;loginBtn.textContent='Verificando...';try{const{error}=await s.auth.signInWithPassword({email,password});if(error){msg.textContent='Falha no login: '+error.message;return}msg.className='msg ok';msg.textContent='Login confirmado. Abrindo o painel...';setTimeout(()=>location.href='./painel.html?v='+Date.now(),500)}catch(e){msg.textContent='Erro de conexão com o Supabase: '+(e?.message||e)}finally{loginBtn.disabled=false;loginBtn.textContent='Entrar'}});$("forgot").addEventListener('click',async()=>{const email=$("email").value.trim();if(!email){msg.textContent='Digite seu e-mail primeiro.';return}const{error}=await s.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error){msg.textContent='Erro ao enviar recuperação: '+error.message;return}msg.className='msg ok';msg.textContent='Enviamos o link de recuperação para seu e-mail.'});$("resetForm").addEventListener('submit',async e=>{e.preventDefault();const a=$("newPassword").value,b=$("confirmPassword").value;if(a!==b){msg.className='msg';msg.textContent='As senhas não conferem.';return}resetBtn.disabled=true;resetBtn.textContent='Salvando...';const{error}=await s.auth.updateUser({password:a});if(error){msg.className='msg';msg.textContent='Não foi possível alterar a senha: '+error.message;resetBtn.disabled=false;resetBtn.textContent='Salvar nova senha';return}msg.className='msg ok';msg.textContent='Senha alterada com sucesso. Entrando no painel...';setTimeout(()=>location.href='./painel.html?v='+Date.now(),700)});</script></body></html>
