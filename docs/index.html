<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GestorPro</title><style>:root{--bg:#0b0a14;--p:#17142a;--v:#8b5cf6;--m:#aaa4bd}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#090812,#17102a);color:#fff;min-height:100vh}.wrap{width:min(1150px,94%);margin:auto}.card{background:#17142a;border:1px solid #332b4d;border-radius:18px;padding:22px;box-shadow:0 15px 50px #0006}.auth{width:min(430px,94%);margin:8vh auto}.logo{font-size:28px;font-weight:800;color:#a78bfa}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;font:inherit}input{background:#0f0d19;color:#fff;border:1px solid #39334f}button{border:0;background:var(--v);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#2b2540}.muted{color:var(--m)}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:30px;display:block}.content{margin-top:16px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:11px;border-bottom:1px solid #2b2740;text-align:left}th{color:var(--m)}.msg{color:#fb7185;min-height:22px}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.top{gap:10px;align-items:flex-start}}
</style></head><body><main id="auth" class="card auth"><div class="logo">GestorPro</div><h2>Acesso ao painel</h2><p class="muted">Clientes, vencimentos, cobranças e pagamentos.</p><form id="login"><input id="email" type="email" placeholder="E-mail" required><input id="pass" type="password" placeholder="Senha" required><button>Entrar</button></form><div id="loginMsg" class="msg"></div></main><section id="dash" class="hidden"><div class="wrap"><header class="top"><div><div class="logo">GestorPro</div><div id="org" class="muted">Organização</div></div><button id="out" class="secondary" style="width:auto">Sair</button></header><div class="stats"><div class="card"><span class="muted">Total</span><b id="total">0</b></div><div class="card"><span class="muted">Ativos</span><b id="active">0</b></div><div class="card"><span class="muted">Vencendo em 7 dias</span><b id="soon">0</b></div><div class="card"><span class="muted">Vencidos</span><b id="expired">0</b></div></div><div class="card content"><div style="display:flex;justify-content:space-between;gap:10px"><h2>Clientes</h2><input id="search" placeholder="Buscar..." style="max-width:280px"></div><form id="add" class="form"><input id="name" placeholder="Nome" required><input id="wa" placeholder="WhatsApp"><input id="plan" placeholder="Plano"><input id="value" type="number" step="0.01" placeholder="Valor"><input id="due" type="date"><input id="mac" placeholder="MAC"><button>Adicionar cliente</button></form><div id="addMsg" class="msg"></div><div style="overflow:auto"><table><thead><tr><th>Cliente</th><th>WhatsApp</th><th>Plano</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://jbdjfmvdrwdfnuhqrprc.supabase.co','sb_publishable_3ABEFAwN_wzmSu13EyVOwQ_h5Xfmz80',{auth:{persistSession:true,autoRefreshToken:true}}),$=x=>document.querySelector(x);let data=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function st(c){if(c.due_date&&new Date(c.due_date+'T23:59:59')<new Date())return'Vencido';if(c.due_date&&new Date(c.due_date+'T23:59:59')<=new Date(Date.now()+6048e5))return'Vencendo';return c.status==='active'?'Ativo':c.status||'Ativo'}function render(){let q=$('#search').value.toLowerCase();let a=data.filter(c=>[c.name,c.whatsapp,c.plan,c.mac].join(' ').toLowerCase().includes(q));$('#rows').innerHTML=a.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.whatsapp)}</td><td>${esc(c.plan)}</td><td>R$ ${Number(c.value||0).toFixed(2).replace('.',',')}</td><td>${c.due_date?new Date(c.due_date+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td><td>${st(c)}</td></tr>`).join('')||'<tr><td colspan="6">Nenhum cliente.</td></tr>'}async function load(){let{data:{user}}=await s.auth.getUser();if(!user){$('#auth').classList.remove('hidden');$('#dash').classList.add('hidden');return}$('#auth').classList.add('hidden');$('#dash').classList.remove('hidden');let{data:p}=await s.from('profiles').select('organization_id').eq('id',user.id).maybeSingle();if(p?.organization_id){let{data:o}=await s.from('organizations').select('name').eq('id',p.organization_id).maybeSingle();$('#org').textContent=o?.name||'Organização'}let r=await s.from('clients').select('id,name,whatsapp,plan,value,due_date,status,mac').order('due_date');if(r.error){$('#org').textContent='Erro: '+r.error.message;return}data=r.data||[];let now=new Date(),end=new Date(Date.now()+6048e5);$('#total').textContent=data.length;$('#active').textContent=data.filter(c=>st(c)==='Ativo').length;$('#soon').textContent=data.filter(c=>c.due_date&&new Date(c.due_date+'T23:59:59')>=now&&new Date(c.due_date+'T23:59:59')<=end).length;$('#expired').textContent=data.filter(c=>st(c)==='Vencido').length;render()}$('#login').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='Entrando...';let{error}=await s.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(error){$('#loginMsg').textContent=error.message;return}load()};$('#out').onclick=async()=>{await s.auth.signOut();location.reload()};$('#search').oninput=render;$('#add').onsubmit=async e=>{e.preventDefault();$('#addMsg').textContent='Salvando...';let{data:{user}}=await s.auth.getUser(),{data:p}=await s.from('profiles').select('organization_id').eq('id',user.id).maybeSingle();if(!p?.organization_id){$('#addMsg').textContent='Usuário sem organização.';return}let{error}=await s.from('clients').insert({organization_id:p.organization_id,name:$('#name').value.trim(),whatsapp:$('#wa').value.trim()||null,plan:$('#plan').value.trim()||null,value:Number($('#value').value||0),due_date:$('#due').value||null,mac:$('#mac').value.trim()||null,status:'active',screens:1,history:[],credit_cost:0,include_payment_link_in_messages:false});if(error)$('#addMsg').textContent=error.message;else{$('#addMsg').textContent='Cliente adicionado.';$('#add').reset();load()}};load();</script></body></html>
